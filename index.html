<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CivicLoop — From community voice to real-world action</title>
<meta name="description" content="CivicLoop turns community reports into tracked, accountable action.">
<style>
/* =========================================================
   CivicLoop — styles
   Palette: deep navy text, warm off-white background, teal/blue accents
   ========================================================= */
:root{
  --navy:#0f1f3d;
  --ink:#16243f;
  --muted:#586377;
  --bg:#f7f5ef;
  --card:#ffffff;
  --line:#e1ded4;
  --teal:#0f766e;
  --teal-dark:#0b5a54;
  --teal-soft:#dcf1ed;
  --blue:#245fa6;
  --blue-soft:#e4edfa;
  --warn-bg:#fff4d6;
  --warn-ink:#6b4a00;
  --danger:#a32424;
  --radius:14px;
  --shadow:0 1px 2px rgba(15,31,61,.05),0 6px 20px rgba(15,31,61,.05);
  --serif:Georgia,"Iowan Old Style","Palatino Linotype",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);color:var(--navy);line-height:1.2;margin:0 0 .5em;font-weight:700;overflow-wrap:anywhere}
h1{font-size:clamp(2rem,4.5vw,3.1rem);letter-spacing:-.02em}
h2{font-size:clamp(1.4rem,2.6vw,1.8rem)}
h3{font-size:1.15rem}
p{margin:0 0 1em;overflow-wrap:anywhere}
a{color:var(--blue)}
:focus-visible{outline:3px solid #1d6fd6;outline-offset:2px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:8px;background:var(--navy);color:#fff;padding:8px 14px;border-radius:8px;z-index:100}
.skip:focus{left:8px}
.container{max-width:1120px;margin:0 auto;padding:0 20px}
.icon{flex:none;vertical-align:-3px}

/* ---------- Header ---------- */
.site-header{background:rgba(247,245,239,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.header-inner{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--navy)}
.brand-name{font-family:var(--serif);font-weight:700;font-size:1.4rem;letter-spacing:-.02em;display:block;line-height:1}
.brand-tag{display:block;font-size:.72rem;color:var(--muted);margin-top:3px;max-width:230px;line-height:1.25}
.main-nav{margin-left:auto;display:flex;align-items:center;gap:4px}
.main-nav a{color:var(--ink);text-decoration:none;padding:8px 12px;border-radius:999px;font-weight:600;font-size:.95rem}
.main-nav a:hover{background:#ece9df}
.main-nav a[aria-current="page"]{background:var(--navy);color:#fff}
.menu-btn{display:none;margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px;color:var(--navy);cursor:pointer}
.mode-btn{border:1.5px dashed var(--teal);background:transparent;color:var(--teal-dark);font-weight:700;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.85rem;font-family:inherit}
.mode-btn[aria-pressed="true"]{background:var(--teal);color:#fff;border-style:solid}
.authority-banner{background:var(--warn-bg);color:var(--warn-ink);border-bottom:1px solid #ecd9a0;font-size:.9rem}
.authority-banner .container{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding-top:10px;padding-bottom:10px}

/* ---------- Buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid transparent;border-radius:999px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;line-height:1.2;transition:background .15s,border-color .15s}
.btn-primary{background:var(--teal);color:#fff}
.btn-primary:hover{background:var(--teal-dark)}
.btn-secondary{background:#fff;color:var(--navy);border-color:#c9c6ba}
.btn-secondary:hover{border-color:var(--navy)}
.btn-ghost{background:transparent;color:var(--blue);padding:8px 12px}
.btn-danger{background:#fff;color:var(--danger);border-color:#e3b6b6}
.btn-danger:hover{background:#fdf0f0}
.btn-sm{padding:7px 14px;font-size:.88rem}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.55;cursor:not-allowed}
.btn.is-active{background:var(--teal-soft);color:var(--teal-dark);border-color:var(--teal)}

/* ---------- Layout helpers ---------- */
main{display:block;padding:32px 0 56px;min-height:60vh}
.section{margin-top:44px}
.section-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{margin:0}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--teal-dark);margin-bottom:10px}
.lead{font-size:1.12rem;color:var(--muted);max-width:56ch}
.grid{display:grid;gap:16px}
.grid-cards{grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.notice{border-radius:12px;padding:12px 14px;font-size:.92rem;border:1px solid var(--line);background:#fff}
.notice.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:#ecd9a0}
.notice.info{background:var(--blue-soft);color:#1b3d6e;border-color:#c5d8f3}
.notice.ok{background:var(--teal-soft);color:var(--teal-dark);border-color:#b3ddd6}

/* ---------- Hero ---------- */
.hero{display:grid;grid-template-columns:1.25fr .9fr;gap:36px;align-items:center;padding:16px 0 8px}
.hero h1 span{color:var(--teal)}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px}
.journey{list-style:none;margin:0;padding:0;counter-reset:j}
.journey li{position:relative;padding:0 0 18px 48px;counter-increment:j}
.journey li:last-child{padding-bottom:0}
.journey li::before{content:counter(j);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.journey li::after{content:"";position:absolute;left:15px;top:34px;bottom:2px;width:2px;background:var(--line)}
.journey li:last-child::after{display:none}
.journey strong{display:block;color:var(--navy)}

/* ---------- Stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.stat-num{font-family:var(--serif);font-size:2.2rem;font-weight:700;color:var(--navy);line-height:1}
.stat-label{font-size:.88rem;color:var(--muted);margin-top:6px}

/* ---------- Badges ---------- */
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#ece9e0;color:#3d4656;white-space:nowrap}
.b-cat{background:#fff;border:1px solid var(--line);color:var(--muted)}
.b-submitted{background:#ece9e0;color:#3d4656}
.b-under-review{background:#e3ecfb;color:#1e40af}
.b-verified{background:#dcf3ee;color:#0b5a54}
.b-insufficient-evidence{background:#fbe9d9;color:#8a3b0c}
.b-forwarded{background:#e8e4f7;color:#4b3a99}
.b-in-progress{background:#fff0c2;color:#7a5200}
.b-resolved{background:#d9f0dd;color:#1e5b2c}
.b-sev-low{background:#e6efe7;color:#2f5a37}
.b-sev-medium{background:#fff0c2;color:#7a5200}
.b-sev-high{background:#fde0d2;color:#8a3b0c}
.b-sev-critical{background:#fbd3d3;color:#8a1c1c}

/* ---------- Issue cards ---------- */
.issue-card{position:relative;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,transform .15s}
.issue-card:hover{border-color:#b9c4d6;transform:translateY(-1px)}
.issue-card h3{margin:0}
.issue-card h3 a{color:var(--navy);text-decoration:none}
.issue-card h3 a::after{content:"";position:absolute;inset:0;border-radius:var(--radius)}
.issue-card h3 a:focus-visible{outline:none}
.issue-card:focus-within{outline:3px solid #1d6fd6;outline-offset:2px}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;color:var(--muted);margin:0}
.meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.86rem;color:var(--muted);margin:0}
.card-foot{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);font-size:.88rem;color:var(--muted)}
.card-foot span{display:inline-flex;align-items:center;gap:5px}
.card-foot .push{margin-left:auto}

/* ---------- Lists (activity) ---------- */
.activity{list-style:none;margin:0;padding:0}
.activity li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.activity li:last-child{border-bottom:0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--teal);margin-top:8px;flex:none}
.activity a{font-weight:600}

/* ---------- Forms ---------- */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
label,.label{font-weight:700;font-size:.92rem;color:var(--navy)}
.hint{font-size:.82rem;color:var(--muted);font-weight:400}
input[type=text],input[type=search],select,textarea,input[type=file]{font:inherit;color:var(--ink);background:#fff;border:1.5px solid #c9c6ba;border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:110px;resize:vertical}
input:hover,select:hover,textarea:hover{border-color:#8f99ab}
[aria-invalid="true"]{border-color:var(--danger)!important}
.field-error{color:var(--danger);font-size:.84rem;font-weight:600;margin:0}
.error-summary{border:1.5px solid #e3b6b6;background:#fdf0f0;color:#7d1d1d;border-radius:12px;padding:12px 14px;margin-bottom:16px}
.preview{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;max-width:360px;background:#fff}
.preview img{display:block;width:100%;height:auto}
.char-count{font-size:.8rem;color:var(--muted);text-align:right}

/* ---------- Feed controls ---------- */
.toolbar{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:12px;align-items:end;margin-bottom:18px}
.search-wrap{position:relative}
.search-wrap .icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search-wrap input{padding-left:38px}
.empty{text-align:center;padding:48px 20px;border:2px dashed #cfcbbd;border-radius:var(--radius);color:var(--muted);background:rgba(255,255,255,.5)}

/* ---------- Issue detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:28px;align-items:start}
.evidence{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#fff}
.evidence img{display:block;width:100%;max-height:420px;object-fit:cover;background:#e9e6dc}
.evidence figcaption{padding:10px 14px;font-size:.84rem;color:var(--muted);border-top:1px solid var(--line)}
.img-fallback{padding:40px 20px;text-align:center;color:var(--muted);background:#efece2}
.support-count{font-family:var(--serif);font-size:2.6rem;font-weight:700;color:var(--navy);line-height:1}
.aside-stack{display:grid;gap:16px;position:sticky;top:96px}
.factor{margin:12px 0}
.factor-top{display:flex;justify-content:space-between;font-size:.88rem;gap:8px}
.bar{height:8px;background:#ece9e0;border-radius:99px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px}
.score{font-family:var(--serif);font-size:2rem;font-weight:700;color:var(--navy)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 22px 28px}
.timeline li:last-child{padding-bottom:0}
.timeline li::before{content:"";position:absolute;left:0;top:6px;width:12px;height:12px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 4px var(--teal-soft)}
.timeline li::after{content:"";position:absolute;left:5px;top:22px;bottom:-4px;width:2px;background:var(--line)}
.timeline li:last-child::after{display:none}
.timeline .t-actor{font-size:.78rem;font-weight:700;color:var(--blue);text-transform:uppercase;letter-spacing:.06em}
.timeline .t-time{font-size:.82rem;color:var(--muted)}
.timeline .t-note{background:#f3f1ea;border-radius:10px;padding:8px 12px;margin:6px 0 0;font-size:.92rem}
.comment{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.comment:last-child{border-bottom:0}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700;flex:none}
.comment p{margin:2px 0 0}

/* ---------- Authority table ---------- */
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 14px;background:#faf9f4;border-bottom:1px solid var(--line)}
td{padding:14px;border-bottom:1px solid var(--line);vertical-align:top;font-size:.92rem}
tr:last-child td{border-bottom:0}
td .title{font-weight:700;color:var(--navy);display:block;overflow-wrap:anywhere}
.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}

/* ---------- Dialog ---------- */
dialog{border:0;border-radius:18px;padding:0;max-width:720px;width:calc(100% - 24px);box-shadow:0 20px 60px rgba(15,31,61,.35);background:var(--bg);color:var(--ink)}
dialog::backdrop{background:rgba(15,31,61,.55)}
.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:start;padding:20px 22px;border-bottom:1px solid var(--line);background:#fff;border-radius:18px 18px 0 0}
.dialog-body{padding:20px 22px;display:grid;gap:16px;max-height:70vh;overflow:auto}

/* ---------- Footer / toast ---------- */
footer{border-top:1px solid var(--line);background:#efece3;padding:28px 0;font-size:.88rem;color:var(--muted)}
.footer-inner{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.25)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.error{background:var(--danger)}


/* ---------- Visual polish ---------- */
::selection{background:#bfe6e0;color:var(--navy)}
body{background:radial-gradient(1000px 460px at 88% -120px,rgba(15,118,110,.11),transparent 62%),radial-gradient(760px 420px at -8% 160px,rgba(36,95,166,.08),transparent 60%),var(--bg);background-repeat:no-repeat}
.site-header{background:rgba(255,255,255,.84);box-shadow:0 1px 0 var(--line),0 10px 30px -18px rgba(15,31,61,.25)}
.brand-name{font-size:1.5rem}
@media (min-width:821px){
  .main-nav{background:#f1eee5;border:1px solid var(--line);padding:4px;border-radius:999px;gap:2px}
  .main-nav a{padding:7px 14px;font-size:.92rem}
  .main-nav a:hover{background:#fff}
  .main-nav .mode-btn{margin-left:6px}
}
.btn{transition:background .15s,border-color .15s,transform .12s,box-shadow .15s}
.btn:active{transform:translateY(1px)}
.btn-primary{box-shadow:0 6px 16px rgba(15,118,110,.26)}
.btn-primary:hover{box-shadow:0 10px 22px rgba(15,118,110,.34);transform:translateY(-1px)}
.btn-secondary:hover{background:#faf9f4}
.btn-light{background:#fff;color:var(--navy)}
.btn-light:hover{background:var(--teal-soft)}
.btn-danger-solid{background:var(--danger);color:#fff}
.btn-danger-solid:hover{background:#861c1c}
.card{border-radius:18px;box-shadow:0 1px 2px rgba(15,31,61,.04),0 14px 34px -16px rgba(15,31,61,.16)}

/* hero */
.hero{padding:28px 0 12px}
.hero h1 span{background:linear-gradient(transparent 64%,rgba(15,118,110,.2) 64%);color:var(--teal-dark);padding:0 .08em}
.hero-card{padding:0;overflow:hidden}
.hero-card h2,.hero-card .journey{margin-left:24px;margin-right:24px}
.hero-card h2{margin-top:20px}
.hero-card .journey{padding-bottom:24px;margin-bottom:0}
.hero-art{display:block;width:100%;height:auto}

/* stats */
.stat{display:flex;gap:14px;align-items:center;border-radius:18px;box-shadow:0 1px 2px rgba(15,31,61,.04),0 10px 26px -16px rgba(15,31,61,.18)}
.stat-ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;background:var(--teal-soft);color:var(--teal-dark);flex:none}
.stat:nth-child(2) .stat-ic{background:var(--blue-soft);color:var(--blue)}
.stat:nth-child(3) .stat-ic{background:#e8e4f7;color:#4b3a99}
.stat:nth-child(4) .stat-ic{background:#d9f0dd;color:#1e5b2c}

/* badges */
.badge{padding:4px 11px}
.badge:not(.b-cat)::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

/* issue cards with evidence thumbnail */
.issue-card{padding:0;overflow:hidden;gap:0}
.issue-card:hover{transform:translateY(-3px);box-shadow:0 20px 42px -18px rgba(15,31,61,.3);border-color:#c3ccdb}
.thumb{position:relative;aspect-ratio:16/8;background:#e9e6dc;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.issue-card:hover .thumb img{transform:scale(1.045)}
.thumb-empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--muted);font-size:.85rem;background:repeating-linear-gradient(135deg,#efece2,#efece2 10px,#f5f2e9 10px,#f5f2e9 20px)}
.thumb .img-fallback{height:100%;padding:0;display:grid;place-items:center;font-size:.85rem}
.thumb-sev{position:absolute;left:12px;top:12px}
.thumb-sev .badge{box-shadow:0 2px 10px rgba(15,31,61,.22)}
.card-body{display:flex;flex-direction:column;gap:6px;padding:16px 20px 18px;flex:1}

/* filter toolbar as a card */
.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 10px 26px -18px rgba(15,31,61,.2)}
.table-wrap{border-radius:18px;box-shadow:0 10px 26px -18px rgba(15,31,61,.2)}
tbody tr:hover td{background:#fbfaf6}

/* call-to-action band */
.cta-band{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;background:var(--navy);color:#fff;border-radius:22px;padding:30px 34px;position:relative;overflow:hidden}
.cta-band::after{content:"";position:absolute;right:-70px;top:-70px;width:230px;height:230px;border:32px solid rgba(95,208,196,.16);border-radius:50%}
.cta-band>*{position:relative;z-index:1}
.cta-band h2{color:#fff;margin-bottom:6px}
.cta-band p{margin:0;color:#c5cee0;max-width:54ch}

/* footer */
footer{background:var(--navy);border-top:0;color:#b9c4da}
footer strong{color:#fff}

.main-nav a[aria-current="page"],.main-nav a[aria-current="page"]:hover{background:var(--navy);color:#fff}
/* header fit + location line */
.header-inner{flex-wrap:nowrap}
.brand{flex:none}
.brand-tag{max-width:200px}
.main-nav .mode-btn{font-size:.8rem;padding:6px 12px;white-space:nowrap}
.meta{flex-wrap:nowrap;align-items:flex-start}
.meta .icon{margin-top:4px}
.meta span{min-width:0}
@media (max-width:820px){.header-inner{flex-wrap:wrap}}

/* confirm dialog */
.confirm-dlg{max-width:440px;padding:26px}
.confirm-dlg h2{font-size:1.3rem}
.confirm-actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:18px}

/* ---------- Responsive ---------- */
@media (max-width:980px){
  .hero{grid-template-columns:1fr}
  .detail{grid-template-columns:1fr}
  .aside-stack{position:static}
  .toolbar{grid-template-columns:1fr 1fr}
  .toolbar .search-wrap{grid-column:1/-1}
  .stats,.mini-stats{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:820px){
  .menu-btn{display:inline-flex}
  .main-nav{display:none;order:5;width:100%;flex-direction:column;align-items:stretch;margin:0;padding-top:6px}
  .main-nav.open{display:flex}
  .main-nav a{padding:12px 14px}
  .brand-tag{display:none}
}
@media (max-width:760px){
  .form-grid{grid-template-columns:1fr}
  .table-wrap{background:transparent;border:0}
  thead{position:absolute;left:-9999px}
  table,tbody,tr,td{display:block;width:100%}
  tr{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;padding:6px 0;box-shadow:var(--shadow)}
  td{border:0;padding:8px 16px;display:flex;gap:12px;justify-content:space-between;align-items:start}

/* =========================================================
   CivicLoop — frontend-only demo
   Everything lives in this file. Data is stored in localStorage.
   Sign-in comes first: Civilian and Authority each get their own pages.
   Read top to bottom: (1) setup, (2) data, (3) helpers,
   (4) views, (5) actions, (6) events.
   ========================================================= */
(function () {
  'use strict';

  /* ---------- 1. SETUP & CONSTANTS ---------- */
  var STORAGE_KEY = 'civicloop_demo_v1';
  var ACCOUNTS_KEY = 'civicloop_accounts_v1';

  // Who is signed in. Kept in memory only, so the sign-in screen appears every time the prototype is opened.
  var session = null; // { id, name, role: 'user' | 'authority' }
  function isAuthority() { return !!session && session.role === 'authority'; }

  // Issue categories (key -> label)
  var CATEGORIES = {

  };

  // Two SEPARATE tracks, so "verified" never gets mixed up with "fixed":
  //  - verification: is the report credible? (demo moderator)
  //  - progress: what has the (simulated) authority done?
  var VERIFICATION = ['Submitted', 'Under Review', 'Verified', 'Insufficient Evidence'];
  var PROGRESS = ['Forwarded', 'In Progress', 'Resolved']; // order matters: you can't go backwards

  var EVIDENCE_LABELS = { 1: 'None or unclear', 2: 'Weak', 3: 'Fair', 4: 'Good', 5: 'Strong' };

  /* ---------- 2. DATA (seed + load/save) ---------- */

  // Builds the fictional starting data. Called on first visit and on reset.

          { ts: hoursAgo(96), type: 'verification', label: 'Verification: Verified', actor: 'Moderator', note: 'Photo shows the pothole depth and the bus-stop landmark matches the stated location.' },
          { ts: hoursAgo(72), type: 'progress', label: 'Progress: Forwarded', actor: 'Authority', note: 'Forwarded to the Roads Maintenance Cell for inspection.' },
          { ts: hoursAgo(24), type: 'progress', label: 'Progress: In Progress', actor: 'Authority', note: 'A repair crew is scheduled for this week. Traffic cones placed as a temporary measure.' }
        ],
        comments: [
          { id: 'c1', name: 'Imran K.', text: 'I pass this every morning. Please fix before the monsoon gets worse.', ts: hoursAgo(100) },
          { id: 'c2', name: 'Neha P.', text: 'Cones are up now, but the hole is still there.', ts: hoursAgo(20) }
        ]
      },
      {
        id: 'ci-1002', title: 'Garbage overflowing at Lake View Market lane',
        description: 'The community bin has not been cleared for about five days. Waste is spilling onto the lane, stray animals are scattering it, and the smell is affecting nearby shops and the tuition centre next door.',
        category: 'waste', locality: 'Lake View Market', city: 'Meridian Nagar', pin: '411057',
        impact: { safety: 3, affected: 4 }, evidenceRating: 3, image: null, sampleArt: 'waste',
        reporter: 'Vikram S.', createdAt: hoursAgo(60), supports: 86, flags: 1,
        verification: 'Under Review', progress: null,

          { ts: hoursAgo(200), type: 'submitted', label: 'Report submitted', actor: 'Community', note: '' },

        verification: 'Verified', progress: null,

        category: 'water', locality: 'Old School Road', city: 'Meridian Nagar', pin: '411038',
        impact: { safety: 2, affected: 2 }, evidenceRating: 1, image: null, sampleArt: null,
        reporter: 'Anonymous community member', createdAt: hoursAgo(150), supports: 9, flags: 2,
        verification: 'Insufficient Evidence', progress: null,
        timeline: [
          { ts: hoursAgo(150), type: 'submitted', label: 'Report submitted', actor: 'Community', note: '' },
          { ts: hoursAgo(120), type: 'verification', label: 'Verification: Insufficient Evidence', actor: 'Moderator', note: 'No photo, no date and the exact spot is unclear. Reporter is invited to submit a new report with details.' }
        ],
        comments: []
      }
    ];

    var activity = [];
    issues.forEach(function (i) {
      i.timeline.forEach(function (t) {
        activity.push({ ts: t.ts, text: t.type === 'submitted' ? 'New report: ' + i.title : t.label + ' — ' + i.title, issueId: i.id });
      });
      i.comments.forEach(function (c) {
        activity.push({ ts: c.ts, text: c.name + ' commented on ' + i.title, issueId: i.id });
      });
    });
    activity.sort(function (a, b) { return new Date(b.ts) - new Date(a.ts); });

    return { version: 1, authority: false, issues: issues, activity: activity.slice(0, 40), profile: { supported: [], flagged: [] } };
  }

  var state = load();

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var s = JSON.parse(raw);
        if (s && Array.isArray(s.issues) && s.profile) return s;
      }
    } catch (e) { /* storage blocked or corrupted: fall back to seed data */ }
    var fresh = seed();
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh)); } catch (e) {}
    return fresh;
  }

  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); return true; }
    catch (e) { toast('Could not save: browser storage is full or blocked. Changes will be lost on refresh.', 'error'); return false; }
  }

    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function slug(s) { return String(s).toLowerCase().replace(/\s+/g, '-'); }
  function fmtDate(ts) {
    return new Date(ts).toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
  function timeAgo(ts) {
    var s = Math.max(1, Math.round((Date.now() - new Date(ts)) / 1000));
    if (s < 60) return 'just now';
    var m = Math.round(s / 60); if (m < 60) return m + ' min ago';
    var h = Math.round(m / 60); if (h < 48) return h + ' h ago';
    return Math.round(h / 24) + ' days ago';
  }
  function findIssue(id) { return state.issues.filter(function (i) { return i.id === id; })[0]; }

  // Pin + shaded circle showing how far the problem reaches, plus other reports nearby
  function mountIssueMap(elId, i) {
    var el = document.getElementById(elId);
    if (!el) return;
    destroyMap(elId);
    if (!mapsReady()) { mapUnavailable(el, 'Connect to the internet to see the map. Affected area: about ' + fmtRadius(radiusOf(i)) + ' around ' + esc(i.locality) + '.'); return; }
    var g = geoOf(i), here = [g.lat, g.lng], r = radiusOf(i), color = SEV_COLOR[severityOf(i).label] || '#0f766e';
    var map = L.map(el, { scrollWheelZoom: false }).setView(here, 15);

    addTiles(map);
    var circle = L.circle(here, { radius: r, color: color, weight: 2, fillColor: color, fillOpacity: 0.18 }).addTo(map);
    circle.bindTooltip('Affected area · about ' + fmtRadius(r) + ' radius');
    state.issues.forEach(function (o) {

      L.circleMarker([og.lat, og.lng], { radius: 6, color: '#586377', weight: 2, fillColor: '#ffffff', fillOpacity: 1 }).addTo(map).bindTooltip('Nearby: ' + esc(o.title));

    var map = L.map(el, { scrollWheelZoom: false }).setView([21.5, 79], 5);

    else {

  /* ----- Home ----- */

    app.innerHTML =

        '<h1 id="hero-title">From community voice to <span>real-world action.</span></h1>' +

      '<section class="cta-band section" aria-label="Report a problem"><div><h2>See something that needs fixing?</h2><p>Report it with a photo and your PIN code. Neighbours can back it, moderators review it, and every step stays visible.</p></div>' +

  function stat(n, label, ic) {
    return '<div class="stat">' + (ic ? '<span class="stat-ic">' + icon(ic, 22) + '</span>' : '') + '<div><div class="stat-num">' + n + '</div><div class="stat-label">' + label + '</div></div></div>';
  }

  /* ----- Feed ----- */
  function selectOptions(map, selected, allLabel) {
    var html = '<option value="all">' + allLabel + '</option>';
    Object.keys(map).forEach(function (k) { html += '<option value="' + k + '"' + (selected === k ? ' selected' : '') + '>' + esc(map[k]) + '</option>'; });
    return html;
  }
  function statusOptions(selected) {
    return '<option value="all">All statuses</option>' + ALL_STATUSES.map(function (s) {
      return '<option value="' + esc(s) + '"' + (selected === s ? ' selected' : '') + '>' + esc(s) + '</option>';
    }).join('');
  }

  // Shared filtering used by feed and authority dashboard
  function filterIssues(f) {
    var tokens = f.q.toLowerCase().split(/\s+/).filter(Boolean);
    var list = state.issues.filter(function (i) {
      if (f.cat !== 'all' && i.category !== f.cat) return false;
      if (f.status !== 'all' && i.verification !== f.status && i.progress !== f.status) return false;
      var hay = [i.title, i.description, i.locality, i.city, i.pin, CATEGORIES[i.category]].join(' ').toLowerCase();
      return tokens.every(function (t) { return hay.indexOf(t) !== -1; }); // every word must match (PIN, locality, city, text)
    });
    list.sort(function (a, b) {
      if (f.sort === 'newest') return new Date(b.createdAt) - new Date(a.createdAt);
      if (f.sort === 'severity') return severityOf(b).score - severityOf(a).score;
      return b.supports - a.supports;
    });
    return list;
  }

  function renderFeed() {
    app.innerHTML =
      '<h1 style="font-size:2.2rem">Community feed</h1>' +

      '<div class="toolbar" role="search">' +
        '<div class="field"><label for="f-q">Search</label><div class="search-wrap">' + icon('search') + '<input type="search" id="f-q" data-feed="q" placeholder="e.g. 411045, Canal Road, pothole" value="' + esc(feedF.q) + '"></div></div>' +
        '<div class="field"><label for="f-cat">Category</label><select id="f-cat" data-feed="cat">' + selectOptions(CATEGORIES, feedF.cat, 'All categories') + '</select></div>' +
        '<div class="field"><label for="f-status">Status</label><select id="f-status" data-feed="status">' + statusOptions(feedF.status) + '</select></div>' +
        '<div class="field"><label for="f-sort">Sort by</label><select id="f-sort" data-feed="sort">' +
          '<option value="support"' + (feedF.sort === 'support' ? ' selected' : '') + '>Most supported</option>' +
          '<option value="newest"' + (feedF.sort === 'newest' ? ' selected' : '') + '>Newest</option>' +
          '<option value="severity"' + (feedF.sort === 'severity' ? ' selected' : '') + '>Highest severity</option></select></div>' +
        '<button class="btn btn-secondary" type="button" data-action="clear-feed">Clear</button>' +

      '<p class="small muted" id="feed-count" aria-live="polite"></p>' +

  function fillFeed() {

      : '<div class="empty"><h3>No matching issues</h3><p>Try a different PIN code, locality or filter — or be the first to report it.</p><a class="btn btn-primary" href="#/report">' + icon('plus') + ' Report a problem</a></div>';
  }

  /* ----- Report form ----- */
  function renderReport() {

    pendingGeo = null;
    app.innerHTML =

          '<div class="field full"><span class="label" id="loc-label">Location on the map</span>' +

  function field(id, label, control, key, full) {
    return '<div class="field' + (full ? ' full' : '') + '"><label for="' + id + '">' + label + '</label>' + control + '<p class="field-error" id="e-' + key + '" hidden></p></div>';

  /* ----- Issue detail ----- */
  function renderIssue(id) {
    var i = findIssue(id);
    if (!i) { renderNotFound(); return; }
    var sev = severityOf(i);
    var ev = evidenceOf(i);
    var supported = state.profile.supported.indexOf(i.id) !== -1;
    var flagged = state.profile.flagged.indexOf(i.id) !== -1;
    var comments = i.comments.slice().sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); });

    app.innerHTML =
      '<p><a href="#/feed" class="btn btn-ghost" style="padding-left:0">' + icon('back', 16) + ' Back to feed</a></p>' +
      '<div class="detail"><div>' +
        '<div class="badges">' + badge(CATEGORIES[i.category], 'b-cat') + verBadge(i) + progBadge(i) + sevBadge(i) + '</div>' +
        '<h1 style="font-size:clamp(1.7rem,3.5vw,2.4rem)">' + esc(i.title) + '</h1>' +
        '<p class="meta" style="margin-bottom:6px">' + icon('pin', 15) + '<span>' + esc(i.locality) + ', ' + esc(i.city) + ' · PIN ' + esc(i.pin) + '</span></p>' +
        '<p class="small muted">Reported by ' + esc(i.reporter) + ' · ' + fmtDate(i.createdAt) + '</p>' +
        (ev
          ? '<figure class="evidence" style="margin:18px 0"><img src="' + esc(ev.src) + '" alt="Evidence for: ' + esc(i.title) + '" data-fallback="1"><figcaption>' + esc(ev.caption) + '</figcaption></figure>'
          : '<div class="notice warn" style="margin:18px 0">' + icon('alert', 16) + ' No evidence image was attached. Reports with clear evidence are easier to verify.</div>') +
        '<h2>Description</h2><p style="white-space:pre-wrap">' + esc(i.description) + '</p>' +
        mapCard(i) +

        '<section class="section" aria-labelledby="tl-title"><h2 id="tl-title">Status timeline</h2><div class="card"><ol class="timeline">' +
          i.timeline.slice().sort(function (a, b) { return new Date(a.ts) - new Date(b.ts); }).map(function (t) {
            return '<li><div class="t-actor">' + esc(t.actor) + '</div><strong>' + esc(t.label) + '</strong><div class="t-time">' + fmtDate(t.ts) + '</div>' + (t.note ? '<p class="t-note">' + esc(t.note) + '</p>' : '') + '</li>';
          }).join('') + '</ol>' +
          '</div></section>' +

        '<section class="section" aria-labelledby="cm-title"><h2 id="cm-title">Discussion (' + comments.length + ')</h2><div class="card">' +
          (comments.length ? comments.map(function (c) {
            return '<div class="comment"><div class="avatar" aria-hidden="true">' + esc(initials(c.name)) + '</div><div><strong>' + esc(c.name) + '</strong> <span class="small muted">· ' + timeAgo(c.ts) + '</span><p>' + esc(c.text) + '</p></div></div>';
          }).join('') : '<p class="muted">No comments yet. Add useful details, such as when you noticed the problem.</p>') +
          (isAuthority() ? '<div class="notice info" style="margin-top:16px">Authorities respond through <strong>Review / respond</strong>, which posts to the public timeline above. Public discussion is for civilians.</div>' :
          '<form id="comment-form" data-form="comment" data-id="' + i.id + '" novalidate style="margin-top:16px;display:grid;gap:12px">' +
            '<div class="field"><label for="c-name">Name (optional)</label><input type="text" id="c-name" maxlength="40" autocomplete="off" value="' + esc(session ? session.name : '') + '"></div>' +

            '<div><button class="btn btn-primary btn-sm" type="submit">Post comment</button></div>' +
          '</form>') + '</div></section>' +
      '</div>' +

      '<aside class="aside-stack" aria-label="Issue summary">' +
        (isAuthority()
          ? '<div class="card"><div class="support-count" aria-live="polite">' + i.supports + '</div><p class="muted small" style="margin:0">community supporters (read-only for authorities)</p>' +
            (i.flags >= 2 ? '<p class="small" style="margin:10px 0 0;color:var(--warn-ink)">Flagged ' + i.flags + ' times for moderator attention.</p>' : '') + '</div>'
          : '<div class="card"><div class="support-count" aria-live="polite">' + i.supports + '</div><p class="muted small">community supporters</p>' +
          '<button class="btn ' + (supported ? 'btn-secondary is-active' : 'btn-primary') + '" type="button" id="support-btn" data-action="support" data-id="' + i.id + '" aria-pressed="' + supported + '" style="width:100%;justify-content:center">' + icon(supported ? 'check' : 'up') + (supported ? ' You supported this' : ' Support this issue') + '</button>' +
          '<p class="small muted" style="margin:10px 0 0">One support per person. Support shows community concern — it does <strong>not</strong> verify an issue.</p>' +
          '<button class="btn btn-ghost btn-sm" type="button" id="flag-btn" data-action="flag" data-id="' + i.id + '"' + (flagged ? ' disabled' : '') + ' style="margin-top:8px">' + icon('flag', 16) + (flagged ? ' You flagged this report' : ' Flag this report') + '</button>' +
          (i.flags >= 2 ? '<p class="small" style="margin:6px 0 0;color:var(--warn-ink)">This report has been flagged ' + i.flags + ' times for moderator attention.</p>' : '') +
        '</div>') +

        '<div class="card"><h3>' + icon('shield', 18) + ' Verification</h3><div class="badges">' + verBadge(i) + '</div><p class="small" style="margin:0">' + verificationText(i.verification) + '</p></div>' +

        '<div class="card"><h3>Severity</h3><div class="score">' + sev.score + '<span class="muted" style="font-size:1rem"> / 100 · ' + sev.label + '</span></div>' +
          factor('Safety risk (× 3)', sev.safety, SAFETY_LABELS[sev.safety]) +
          factor('People affected (× 2)', sev.affected, AFFECTED_LABELS[sev.affected]) +
          factor('Evidence quality (× 1)', sev.evidence, EVIDENCE_LABELS[sev.evidence] + (sev.estimated ? ' (auto-estimate)' : '')) +

      '</aside></div>';
    mountIssueMap('issue-map', i);
  }
  function factor(label, val, text) {

  /* ----- Authority dashboard ----- */
  function renderAuthority() {

  function fillAuthority() {

    box.innerHTML = '<div class="table-wrap"><table><caption class="sr-only">Issues for authority review</caption><thead><tr><th scope="col">Issue</th><th scope="col">Priority</th><th scope="col">Public support</th><th scope="col">Verification</th><th scope="col">Progress</th><th scope="col">Evidence</th><th scope="col">Action</th></tr></thead><tbody>' +

          '<td data-label="Verification"><span>' + verBadge(i) + '</span></td>' +

          '<td data-label="Evidence"><span class="small">' + (i.evidenceRating != null ? EVIDENCE_LABELS[i.evidenceRating] : (i.image ? 'Photo, not rated' : 'Not rated')) + '</span></td>' +
          '<td data-label="Action"><button class="btn btn-secondary btn-sm" type="button" data-action="manage" data-id="' + i.id + '">Review / respond</button></td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  /* ----- Manage dialog (evidence review + response) ----- */
  var dlg = document.getElementById('manage-dialog');
  function renderManage(id) {
    var i = findIssue(id);
    if (!i) return;
    destroyMap('manage-map');
    var ev = evidenceOf(i);

    var nextOptions = PROGRESS.filter(function (p, idx) { return idx > rank; });
    var progressHtml;
    if (i.verification !== 'Verified') {
      progressHtml = '<div class="notice info">Authority actions unlock after a moderator marks this report <strong>Verified</strong>. Support count alone is never enough.</div>';

      progressHtml = '<form data-form="progress" data-id="' + i.id + '" novalidate style="display:grid;gap:12px">' +
        '<div class="field"><label for="m-prog">New progress status</label><select id="m-prog">' + nextOptions.map(function (p) { return '<option value="' + p + '">' + p + '</option>'; }).join('') + '</select></div>' +
        '<div class="field"><label for="m-resp">Response to the public</label><textarea id="m-resp" maxlength="600" aria-describedby="m-err2" style="min-height:90px"></textarea><span class="hint">Required. If you choose “Resolved”, this becomes the public resolution note — describe what was done.</span><p class="field-error" id="m-err2" role="alert" hidden></p></div>' +
        '<div><button class="btn btn-primary btn-sm" type="submit">Post response</button></div></form>';
    }

    dlg.innerHTML =
      '<div class="dialog-head"><div><p class="eyebrow" style="margin-bottom:4px">Authority workspace</p><h2 id="md-title" style="margin:0;font-size:1.3rem">' + esc(i.title) + '</h2>' +
        '<div class="badges" style="margin:10px 0 0">' + verBadge(i) + progBadge(i) + sevBadge(i) + '</div></div>' +
        '<button class="btn btn-secondary btn-sm" type="button" data-action="close-dialog" aria-label="Close dialog">' + icon('x', 16) + ' Close</button></div>' +
      '<div class="dialog-body">' +
        '<p class="small muted" style="margin:0">' + icon('pin', 14) + ' ' + esc(i.locality) + ', ' + esc(i.city) + ' · PIN ' + esc(i.pin) + ' · ' + i.supports + ' public supporters (support is not verification)</p>' +
        (ev ? '<figure class="evidence" style="margin:0"><img src="' + esc(ev.src) + '" alt="Evidence for ' + esc(i.title) + '" data-fallback="1" style="max-height:220px"><figcaption>' + esc(ev.caption) + '</figcaption></figure>' : '<div class="notice warn">No evidence image attached.</div>') +
        '<div><div id="manage-map" class="map-box compact" role="region" aria-label="Map of the affected area"></div><p class="small muted" style="margin:8px 0 0">' + areaSummary(i) + '</p></div>' +
        '<section class="card" aria-labelledby="m-h1"><h3 id="m-h1">1. Evidence review</h3>' +
          '<form data-form="verify" data-id="' + i.id + '" novalidate style="display:grid;gap:12px">' +
            '<div class="form-grid"><div class="field"><label for="m-ver">Verification status</label><select id="m-ver">' + ['Under Review', 'Verified', 'Insufficient Evidence'].map(function (v) { return '<option' + (i.verification === v ? ' selected' : '') + '>' + v + '</option>'; }).join('') + '</select></div>' +
            '<div class="field"><label for="m-evq">Evidence quality</label><select id="m-evq">' + [1, 2, 3, 4, 5].map(function (n) { return '<option value="' + n + '"' + ((i.evidenceRating != null ? i.evidenceRating : (i.image ? 2 : 1)) === n ? ' selected' : '') + '>' + n + ' — ' + EVIDENCE_LABELS[n] + '</option>'; }).join('') + '</select></div></div>' +
            '<div class="field"><label for="m-note">Review note</label><textarea id="m-note" maxlength="400" aria-describedby="m-err1" style="min-height:72px"></textarea><span class="hint">Required for “Insufficient Evidence”; recommended otherwise.</span><p class="field-error" id="m-err1" role="alert" hidden></p></div>' +
            '<div><button class="btn btn-primary btn-sm" type="submit">Save review</button></div></form></section>' +
        '<section class="card" aria-labelledby="m-h2"><h3 id="m-h2">2. Authority response and progress</h3>' + progressHtml + '</section>' +
      '</div>';
    // the dialog is opened right after this runs, so draw the map on the next tick
    setTimeout(function () { mountIssueMap('manage-map', i); }, 0);
  }

  function renderNotFound() {
    app.innerHTML = '<div class="empty" style="margin-top:20px"><h1 style="font-size:1.8rem">Page not found</h1><p>That issue or page does not exist.</p><a class="btn btn-primary" href="#/feed">Go to community feed</a></div>';
  }

  /* ---------- 5. ROUTER ---------- */
  function parseHash(h) {
    var parts = (h || location.hash || '#/home').replace(/^#\/?/, '').split('/');
    return { name: parts[0] || 'home', arg: parts[1] || null };
  }
  var TITLES = { login: 'Sign in', home: 'Home', feed: 'Community feed', report: 'Report a problem', authority: 'Authority dashboard', issue: 'Issue details' };

  function renderView(isNavigation) {
    destroyMaps();
    // Nobody signed in -> always show the sign-in screen
    if (!session) { showLogin(); return; }
    var v = current;
    // Role guards: each role only sees its own pages
    if (v.name === 'login') { navigate(isAuthority() ? '#/authority' : '#/home'); return; }
    if (isAuthority() && (v.name === 'home' || v.name === 'report')) { navigate('#/authority'); return; }
    if (!isAuthority() && v.name === 'authority') { toast('The dashboard is only for Authority accounts.', 'error'); navigate('#/home'); return; }
    document.body.classList.remove('auth-mode');
    if (v.name === 'home') renderHome();
    else if (v.name === 'feed') renderFeed();
    else if (v.name === 'report') renderReport();
    else if (v.name === 'issue') renderIssue(v.arg);
    else if (v.name === 'authority') renderAuthority();
    else renderNotFound();
    updateChrome();
    document.title = (TITLES[v.name] || 'Not found') + ' · CivicLoop';
    if (isNavigation) {
      window.scrollTo(0, 0);
      var h = app.querySelector('h1');
      if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
    }
  }
  // Go to a page. We render directly (not only via the URL hash) so it works
  // even where the hash can't change, e.g. some embedded previews.
  function navigate(hash) {
    current = parseHash(hash);
    try { if (location.hash !== hash) location.hash = hash; } catch (e) { /* ignore */ }
    closeMenu();
    renderView(true);
  }
  // Browser back/forward buttons (only re-render if the page really changed)
  function onHashChange() {
    if (!session) { showLogin(); return; }
    var p = parseHash();
    if (p.name === current.name && p.arg === current.arg) return;
    current = p;
    closeMenu();
    renderView(true);
  }

  // Header nav highlight, authority toggle and banner
  function updateChrome() {
    var navKey = current.name === 'issue' ? 'feed' : current.name;
    Array.prototype.forEach.call(document.querySelectorAll('[data-nav]'), function (a) {
      if (a.getAttribute('data-nav') === navKey) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    });
    if (!session) return;
    Array.prototype.forEach.call(document.querySelectorAll('[data-for]'), function (el) {
      var f = el.getAttribute('data-for');
      el.hidden = !(f === 'both' || f === session.role);
    });
    var chip = document.getElementById('user-chip');
    chip.className = 'user-chip' + (isAuthority() ? ' is-authority' : '');
    chip.innerHTML = '<span class="avatar" aria-hidden="true">' + esc(initials(session.name)) + '</span>' + esc(session.name) + ' <small>' + (isAuthority() ? 'Authority' : 'Civilian') + '</small>';
    document.querySelector('.brand').setAttribute('href', isAuthority() ? '#/authority' : '#/home');
  }
  function closeMenu() {
    document.getElementById('main-nav').classList.remove('open');
    document.getElementById('menu-btn').setAttribute('aria-expanded', 'false');
  }

  /* ---------- 6. ACTIONS ---------- */
  function showErr(id, msg) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg || '';
    el.hidden = !msg;
  }
  function setInvalid(id, bad) {
    var el = document.getElementById(id);
    if (el) { if (bad) el.setAttribute('aria-invalid', 'true'); else el.removeAttribute('aria-invalid'); }
  }

  // Shrink uploaded photos so localStorage doesn't fill up
  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onerror = reject;
      reader.onload = function () {
        var img = new Image();
        img.onerror = reject;
        img.onload = function () {
          var max = 900, scale = Math.min(1, max / Math.max(img.width, img.height));
          var w = Math.round(img.width * scale), h = Math.round(img.height * scale);
          var c = document.createElement('canvas'); c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
  }

  function handleImageChange(input) {
    var file = input.files && input.files[0];
    var prev = document.getElementById('image-preview');
    pendingImage = null; prev.innerHTML = ''; showErr('e-image', '');
    if (!file) return;
    if (!/^image\//.test(file.type)) { showErr('e-image', 'Please choose an image file (JPG, PNG or WebP).'); input.value = ''; return; }
    if (file.size > 8 * 1024 * 1024) { showErr('e-image', 'That image is larger than 8 MB. Please choose a smaller one.'); input.value = ''; return; }
    readImage(file).then(function (dataUrl) {
      pendingImage = dataUrl;
      prev.innerHTML = '<div class="preview" style="margin-top:8px"><img src="' + dataUrl + '" alt="Preview of the image you selected"></div>' +
        '<button type="button" class="btn btn-ghost btn-sm" data-action="remove-image">Remove image</button>';
    }).catch(function () { showErr('e-image', 'That image could not be read. Try a different file.'); input.value = ''; });
  }

  function submitReport(form) {
    var v = function (id) { return document.getElementById(id).value.trim(); };
    var data = { title: v('r-title'), category: v('r-cat'), description: v('r-desc'), locality: v('r-locality'), city: v('r-city'), pin: v('r-pin') };
    var errors = {}; // key -> message
    if (data.title.length < 5) errors.title = 'Enter a title of at least 5 characters.';
    if (!data.category) errors.category = 'Choose a category.';
    if (data.description.length < 20) errors.description = 'Describe the problem in at least 20 characters.';
    if (!data.locality) errors.locality = 'Enter the locality or landmark.';
    if (!data.city) errors.city = 'Enter the city.';
    if (!/^[1-9][0-9]{5}$/.test(data.pin)) errors.pin = 'Enter a valid 6-digit PIN code (it cannot start with 0).';

    var ids = { title: 'r-title', category: 'r-cat', description: 'r-desc', locality: 'r-locality', city: 'r-city', pin: 'r-pin' };
    var keys = Object.keys(ids), firstBad = null, msgs = [];
    keys.forEach(function (k) {
      showErr('e-' + k, errors[k]); setInvalid(ids[k], !!errors[k]);
      if (errors[k]) { msgs.push(errors[k]); if (!firstBad) firstBad = ids[k]; }
    });
    var summary = document.getElementById('report-errors');
    if (msgs.length) {
      summary.hidden = false;
      summary.textContent = 'Please fix ' + msgs.length + (msgs.length === 1 ? ' problem' : ' problems') + ' below before submitting.';
      document.getElementById(firstBad).focus();
      return;
    }
    summary.hidden = true;

    var snap = {
      safety: Number(document.getElementById('r-safety').value), affected: Number(document.getElementById('r-affected').value),
      reporter: v('r-name') || 'Anonymous community member', image: pendingImage
    };
    function finish(geo, approx) {
      if (!document.getElementById('report-form')) return; // the person left this page while the location was being found
      var now = new Date().toISOString();
      var issue = {
        id: 'ci-' + Date.now().toString(36),
        title: data.title, description: data.description, category: data.category,
        locality: data.locality, city: data.city, pin: data.pin,
        impact: { safety: snap.safety, affected: snap.affected },
        evidenceRating: null, image: snap.image, sampleArt: null, lat: geo.lat, lng: geo.lng, approx: approx,
        reporter: snap.reporter, createdAt: now, supports: 0, flags: 0,
        verification: 'Submitted', progress: null,
        timeline: [{ ts: now, type: 'submitted', label: 'Report submitted', actor: 'Community', note: '' }],
        comments: []
      };
      state.issues.unshift(issue);
      logActivity('New report: ' + issue.title, issue.id);
      if (!save()) { /* toast already shown; keep in memory for this session */ }
      pendingImage = null;
      toast('Report submitted. It now awaits moderator review.');
      navigate('#/issue/' + issue.id);
    }

    if (pendingGeo) { finish(pendingGeo, false); return; }

    // No pin was placed: find the address, then fall back to the PIN code's area
    var btn = form.querySelector('button[type="submit"]');
    if (btn) { btn.disabled = true; btn.textContent = 'Finding location…'; }
    geocode(addressQueries(data.locality, data.city, data.pin), function (g) {
      if (!document.getElementById('report-form')) return;
      if (btn) { btn.disabled = false; btn.textContent = 'Submit report'; }
      if (g) { finish({ lat: g.lat, lng: g.lng }, g.k !== 0); return; }
      var c = pinCenter(data.pin) || CITY_CENTER, sp = spread(data.title + data.pin);
      finish({ lat: c[0] + sp[0], lng: c[1] + sp[1] }, true);
    });
  }

  function addComment(form) {
    var i = findIssue(form.getAttribute('data-id'));
    var text = document.getElementById('c-text').value.trim();
    var name = document.getElementById('c-name').value.trim() || 'Anonymous community member';
    if (text.length < 2) { showErr('e-ctext', 'Write at least 2 characters.'); setInvalid('c-text', true); document.getElementById('c-text').focus(); return; }
    i.comments.push({ id: 'c' + Date.now().toString(36), name: name, text: text, ts: new Date().toISOString() });
    logActivity(name + ' commented on ' + i.title, i.id);
    save();
    renderView(false);
    toast('Comment posted.');
    var box = document.getElementById('c-text'); if (box) box.focus();
  }

  function supportIssue(id) {
    var i = findIssue(id);
    if (!i) return;
    if (state.profile.supported.indexOf(id) !== -1) { toast('You have already supported this issue.'); return; }
    i.supports += 1;
    state.profile.supported.push(id);
    logActivity('A neighbour supported ' + i.title, id);
    save();
    renderView(false);
    toast('Thanks for your support. Remember: support is not verification.');
    var b = document.getElementById('support-btn'); if (b) b.focus();
  }

  // In-page confirmation dialog (native confirm() is blocked in some embedded previews)
  var cdlg = document.getElementById('confirm-dialog');
  var confirmResolve = null;
  function askConfirm(title, text, okLabel, danger) {
    if (typeof cdlg.showModal !== 'function') return Promise.resolve(window.confirm(text));
    return new Promise(function (resolve) {
      document.getElementById('cf-title').textContent = title;
      document.getElementById('cf-text').textContent = text;
      var ok = document.getElementById('confirm-ok');
      ok.textContent = okLabel;
      ok.className = 'btn ' + (danger ? 'btn-danger-solid' : 'btn-primary');
      confirmResolve = resolve;
      cdlg.showModal();
      document.getElementById('confirm-cancel').focus();
    });
  }
  function finishConfirm(answer) {
    var r = confirmResolve; confirmResolve = null;
    if (cdlg.open) cdlg.close();
    if (r) r(answer);
  }

  function flagIssue(id) {
    var i = findIssue(id);
    if (!i || state.profile.flagged.indexOf(id) !== -1) return;
    askConfirm('Flag this report?', 'Flag it for moderator attention if it looks like spam, a duplicate or misleading.', 'Flag report').then(function (yes) {
      if (!yes) return;
      i.flags += 1;
      state.profile.flagged.push(id);
      logActivity('A report was flagged for review: ' + i.title, id);
      save();
      renderView(false);
      toast('Report flagged for moderator review.');
      var fb = document.getElementById('flag-btn'); if (fb) fb.focus();
    });
  }

  function saveVerification(form) {
    var i = findIssue(form.getAttribute('data-id'));
    var status = document.getElementById('m-ver').value;
    var rating = Number(document.getElementById('m-evq').value);
    var note = document.getElementById('m-note').value.trim();
    if (status === 'Insufficient Evidence' && note.length < 5) { showErr('m-err1', 'Add a short note explaining why the evidence is insufficient.'); return; }
    if (i.progress && status !== 'Verified') { showErr('m-err1', 'Authority progress has already started, so this report must stay Verified.'); return; }
    showErr('m-err1', '');
    i.verification = status;
    i.evidenceRating = rating;
    i.timeline.push({ ts: new Date().toISOString(), type: 'verification', label: 'Verification: ' + status, actor: 'Moderator', note: note });
    logActivity('Verification: ' + status + ' — ' + i.title, i.id);
    save();
    renderManage(i.id);
    toast('Review saved. The public timeline has been updated.');
  }

  function saveProgress(form) {
    var i = findIssue(form.getAttribute('data-id'));
    var status = document.getElementById('m-prog').value;
    var resp = document.getElementById('m-resp').value.trim();
    if (i.verification !== 'Verified') { showErr('m-err2', 'Only Verified reports can receive authority progress updates.'); return; }
    if (resp.length < 10) { showErr('m-err2', status === 'Resolved' ? 'A resolution note of at least 10 characters is required to mark this Resolved.' : 'Enter a response of at least 10 characters.'); document.getElementById('m-resp').focus(); return; }
    var rank = i.progress ? PROGRESS.indexOf(i.progress) : -1;
    if (PROGRESS.indexOf(status) <= rank) { showErr('m-err2', 'Progress cannot move backwards.'); return; }
    showErr('m-err2', '');
    i.progress = status;
    i.timeline.push({ ts: new Date().toISOString(), type: 'progress', label: 'Progress: ' + status, actor: 'Authority', note: resp });
    logActivity('Progress: ' + status + ' — ' + i.title, i.id);
    save();
    renderManage(i.id);
    toast('Response posted to the public timeline.');
  }

  function openManage(id) {
    renderManage(id);
    if (typeof dlg.showModal === 'function') dlg.showModal(); else dlg.setAttribute('open', '');
  }

  /* ---------- SIGN-IN / SIGN-OUT (demo only, not real security) ---------- */
  var SEED_ACCOUNTS = {
    citizen: { pw: 'demo123', role: 'user', name: 'Citizen' },
    officer: { pw: 'demo123', role: 'authority', name: 'Officer' }
  };
  var loginMode = 'signin';
  var $ = function (id) { return document.getElementById(id); };

  function loadAccounts() { try { return JSON.parse(localStorage.getItem(ACCOUNTS_KEY)) || {}; } catch (e) { return {}; } }
  function saveAccounts(a) { try { localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(a)); } catch (e) {} }
  function pickedRole() { return document.querySelector('#login-form input[name=role]:checked').value; }
  function loginMsg(text, ok) {
    var m = $('lg-msg');
    m.textContent = text || '';
    m.hidden = !text;
    m.className = ok ? 'notice ok' : 'error-summary';
    m.style.margin = '0';
  }
  function setLoginMode(mode) {
    loginMode = mode;
    var up = mode === 'signup';
    $('name-field').hidden = !up;
    $('lg-go').textContent = up ? 'Create account' : 'Sign in';
    $('lg-toggle').textContent = up ? 'Back to sign in' : 'Create a test account';
    $('lg-pw').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
    loginMsg('');
  }

  // Shows the sign-in screen and hides the rest of the app
  function showLogin() {
    document.body.classList.add('auth-mode');
    document.title = 'Sign in · CivicLoop';
    if (dlg.open) dlg.close();
    window.scrollTo(0, 0);
  }

  function signIn(user) {
    session = { id: user.id, name: user.name, role: user.role };
    $('lg-pw').value = ''; $('lg-id').value = ''; $('lg-name').value = '';
    setLoginMode('signin');
    document.body.classList.remove('auth-mode');
    navigate(isAuthority() ? '#/authority' : '#/home');
    toast('Welcome, ' + user.name + '! Signed in as ' + (isAuthority() ? 'an Authority' : 'a Civilian') + '.');
  }

  function signOut() {
    session = null;
    if (dlg.open) dlg.close();
    pendingImage = null;
    current = { name: 'login', arg: null };
    try { location.hash = '#/login'; } catch (e) { /* ignore */ }
    closeMenu();
    showLogin();
    setTimeout(function () { var f = $('lg-id'); if (f) f.focus(); }, 0);
    toast('You have been signed out.');
  }

  function submitLogin(e) {
    e.preventDefault();
    var id = $('lg-id').value.trim().toLowerCase(), pw = $('lg-pw').value, role = pickedRole();
    if (!id || !pw) { loginMsg('Please enter your Login ID and password.'); return; }
    var accts = loadAccounts();
    if (loginMode === 'signup') {
      var nm = $('lg-name').value.trim();
      if (!nm) { loginMsg('Please enter your full name.'); return; }
      if (!/^[a-z0-9._-]{3,}$/.test(id)) { loginMsg('Login ID must be at least 3 characters (letters, numbers, . _ -).'); return; }
      if (pw.length < 6) { loginMsg('Password must be at least 6 characters.'); return; }
      if (SEED_ACCOUNTS[id] || accts[id]) { loginMsg('That Login ID is already taken.'); return; }
      accts[id] = { pw: pw, role: role, name: nm };
      saveAccounts(accts);
      setLoginMode('signin');
      $('lg-id').value = id; $('lg-pw').value = '';
      loginMsg('Test account created. Sign in to continue.', true);
      $('lg-pw').focus();
      return;
    }
    var a = accts[id] || SEED_ACCOUNTS[id];
    if (!a || a.pw !== pw) { loginMsg('Incorrect Login ID or password.'); return; }
    if (a.role !== role) { loginMsg('This account is registered as ' + (a.role === 'user' ? 'a Civilian' : 'an Authority') + '. Pick the matching role above.'); return; }
    signIn({ id: id, name: a.name, role: a.role });
  }

  function bindLogin() {
    $('login-form').addEventListener('submit', submitLogin);
    $('lg-toggle').addEventListener('click', function () { setLoginMode(loginMode === 'signin' ? 'signup' : 'signin'); });
    $('lg-eye').addEventListener('click', function () {
      var p = $('lg-pw'), hidden = p.type === 'password';
      p.type = hidden ? 'text' : 'password';
      this.textContent = hidden ? 'Hide' : 'Show';
      this.setAttribute('aria-label', hidden ? 'Hide password' : 'Show password');
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-fill]'), function (b) {
      b.addEventListener('click', function () {
        var id = b.getAttribute('data-fill');
        setLoginMode('signin');
        document.querySelector('#login-form input[name=role][value=' + SEED_ACCOUNTS[id].role + ']').checked = true;
        $('lg-id').value = id; $('lg-pw').value = SEED_ACCOUNTS[id].pw;
        loginMsg('');
        $('lg-go').focus();
      });
    });
  }

  /* ---------- 7. EVENTS (one listener per type — "event delegation") ---------- */
  document.addEventListener('click', function (e) {
    // Page links: handle them ourselves so navigation always works
    var link = e.target.closest('a[href^="#/"]');
    if (link && e.button === 0 && !e.metaKey && !e.ctrlKey && !e.shiftKey && !e.altKey) {
      e.preventDefault();
      navigate(link.getAttribute('href'));
      return;
    }
    var el = e.target.closest('[data-action]');
    if (!el) return;
    var a = el.getAttribute('data-action'), id = el.getAttribute('data-id');
    if (a === 'support') supportIssue(id);
    else if (a === 'flag') flagIssue(id);
    else if (a === 'manage') openManage(id);
    else if (a === 'close-dialog') dlg.close();
    else if (a === 'logout') signOut();
    else if (a === 'clear-feed') { feedF = { q: '', cat: 'all', status: 'all', sort: 'support' }; renderFeed(); }
    else if (a === 'clear-auth') { authF = { q: '', cat: 'all', status: 'all', sort: 'severity' }; renderAuthority(); }
    else if (a === 'geo-me') geoMe();
    else if (a === 'geo-find') geoFind();
    else if (a === 'remove-image') { pendingImage = null; document.getElementById('r-image').value = ''; document.getElementById('image-preview').innerHTML = ''; }
  });

  function runForm(form) {
    var kind = form.getAttribute('data-form');
    if (kind === 'report') submitReport(form);
    else if (kind === 'comment') addComment(form);
    else if (kind === 'verify') saveVerification(form);
    else if (kind === 'progress') saveProgress(form);
  }
  // Some embedded previews block real form submission, so the 'submit' event never fires.
  // Handling the submit-button click directly (Enter key also triggers it) works everywhere.
  document.addEventListener('click', function (e) {
    var sb = e.target.closest('button[type="submit"]');
    if (!sb || !sb.form) return;
    if (sb.form.id === 'login-form') { e.preventDefault(); submitLogin(e); }
    else if (sb.form.hasAttribute('data-form')) { e.preventDefault(); runForm(sb.form); }
  });
  document.addEventListener('submit', function (e) {
    var form = e.target.closest('[data-form]');
    if (!form) return;
    e.preventDefault();
    runForm(form);
  });

  function onFilterInput(e) {
    var t = e.target;
    // Only re-render when the value really changed. (A 'change' event fires when a text box
    // loses focus; re-rendering then replaced the button you were clicking and swallowed the click.)
    if (t.hasAttribute('data-feed')) {
      var fk = t.getAttribute('data-feed');
      if (feedF[fk] === t.value) return;
      feedF[fk] = t.value; fillFeed();
    } else if (t.hasAttribute('data-auth')) {
      var ak = t.getAttribute('data-auth');
      if (authF[ak] === t.value) return;
      authF[ak] = t.value; fillAuthority();
    }
  }
  document.addEventListener('input', onFilterInput);
  document.addEventListener('change', function (e) {
    onFilterInput(e);
    if (e.target.id === 'r-image') handleImageChange(e.target);
    if (e.target.id === 'r-pin') centerPickerOnPin();
  });

  // Broken or missing images fall back to a friendly message (error events don't bubble, so use capture)
  document.addEventListener('error', function (e) {
    var img = e.target;
    if (img && img.tagName === 'IMG' && img.getAttribute('data-fallback')) {
      var d = document.createElement('div');
      d.className = 'img-fallback';
      d.textContent = 'The evidence image could not be loaded.';
      img.replaceWith(d);
    }
  }, true);

  // Mobile menu
  document.getElementById('menu-btn').addEventListener('click', function () {
    var nav = document.getElementById('main-nav');
    var open = nav.classList.toggle('open');
    this.setAttribute('aria-expanded', String(open));
  });

  // When the dialog closes, refresh the page behind it so changes show up
  dlg.addEventListener('close', function () { renderView(false); });
  // Click outside the dialog box closes it
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  // Confirm dialog buttons
  document.getElementById('confirm-ok').addEventListener('click', function () { finishConfirm(true); });
  document.getElementById('confirm-cancel').addEventListener('click', function () { finishConfirm(false); });
  cdlg.addEventListener('click', function (e) { if (e.target === cdlg) finishConfirm(false); });
  cdlg.addEventListener('close', function () { if (confirmResolve) { var r = confirmResolve; confirmResolve = null; r(false); } }); // Esc key

  // Keep multiple tabs in sync (demo convenience)
  window.addEventListener('storage', function (e) {
    if (session && e.key === STORAGE_KEY && !dlg.open && current.name !== 'report') { state = load(); renderView(false); }
  });

  window.addEventListener('hashchange', onHashChange);

  // Start: the sign-in screen always comes first
  bindLogin();
  try { if (location.hash !== '#/login') location.hash = '#/login'; } catch (e) { /* ignore */ }
  current = { name: 'login', arg: null };
  renderView(false);
})();
</script>
</body>
</html>
